<!doctype html><html lang=ru><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>LinguaGo</title><meta name=theme-color content=#58cc02><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><meta name=apple-mobile-web-app-title content=LinguaGo><link rel=manifest href=manifest.webmanifest><link rel=apple-touch-icon href=icon.png><style>:root{--bg:#fff;--fg:#263238;--line:#ddd}body{background:var(--bg);color:var(--fg);font:17px system-ui;max-width:540px;margin:auto;padding:20px}body.dark{--bg:#14252d;--fg:#eee;--line:#456}button,input{font:inherit;padding:14px;border:2px solid var(--line);border-radius:14px;margin:5px 0;box-sizing:border-box;width:100%;background:var(--bg);color:var(--fg)}button{cursor:pointer}button:disabled{opacity:.5}.green{background:#58cc02;color:#fff;border:0}header{display:flex;justify-content:space-between;align-items:center}header button{width:auto}h1{color:#58bb02}.card{padding:15px;border:2px solid var(--line);border-radius:16px;margin:12px 0}small{opacity:.75}progress{width:100%;accent-color:#58cc02}.selected{border-color:#1cb0f6}.good{color:#58bb02}.bad{color:#ed5555}</style></head><body><header><h1>LinguaGo</h1><button onclick=theme()>☀️ / 🌙</button></header><div id=stats></div><main id=app></main><script>const $=id=>document.getElementById(id);let db;try{db=JSON.parse(localStorage.getItem('lg3')||'{}')}catch(e){db={}}db.users=db.users||{};let user=null,li=0,qi=0,score=0,gain=0,selected=-1,locked=false,timer,seconds=30,mult=1;const data=[['Приветствия',[['Привет','Hello','Bye','Please'],['Спасибо','Thank you','Sorry','Hello'],['Пока','Bye','Yes','Hello'],['Пожалуйста','Please','No','Thanks']]],['Числа',[['Один','One','Two','Ten'],['Два','Two','Four','One'],['Три','Three','Five','Ten'],['Четыре','Four','Six','Two']]],['Еда',[['Яблоко','Apple','Bread','Milk'],['Вода','Water','Tea','Juice'],['Хлеб','Bread','Rice','Cheese'],['Молоко','Milk','Salt','Coffee']]],['Глаголы',[['Есть (принимать пищу)','Eat','Run','Sleep'],['Идти','Go','Stop','Sit'],['Читать','Read','Write','Speak'],['Спать','Sleep','Wake','Work']]]];let options=[];function save(){try{localStorage.setItem('lg3',JSON.stringify(db))}catch(e){alert('Не удалось сохранить прогресс в браузере')}}function esc(t){const e=document.createElement('span');e.textContent=t;return e.innerHTML}function theme(){db.dark=!db.dark;document.body.classList.toggle('dark',db.dark);save()}function sound(ok){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.06;o.frequency.value=ok?800:200;o.start();o.stop(c.currentTime+.15);setTimeout(()=>c.close(),250)}catch(e){}}function stats(){$('stats').textContent=user?`${user.name} · ⭐ ${user.xp} XP · Уровень ${1+Math.floor(user.xp/100)} · 💎 ${user.gems} · 🔥 ${user.streak}`:''}function login(){$('app').innerHTML='<h2>Локальный профиль</h2><p>Без пароля и серверной регистрации. Прогресс и рейтинг только в этом браузере.</p><input id=name maxlength=30 placeholder="Ваше имя"><button class=green onclick=enter()>Продолжить</button>';stats()}function enter(){const name=$('name').value.trim();if(!name)return;const key='user:'+name;if(!db.users[key])db.users[key]={name,xp:0,gems:50,streak:0,last:'',done:{},badges:[],boost:false,retry:false};db.current=key;user=db.users[key];save();home()}function home(){clearInterval(timer);stats();$('app').innerHTML='<h2>Выбери урок</h2><p>Все уроки доступны сразу.</p>'+data.map((l,i)=>`<div class=card><h3>${l[0]}</h3><small>Лучший результат: ${user.done[i]||0}/4</small><progress max=4 value=${user.done[i]||0}></progress><button class=green onclick=start(${i})>Начать</button></div>`).join('')+`<p>Достижения: ${user.badges.map(esc).join(', ')||'Пока нет'}</p><button onclick=shop()>Магазин</button><button onclick=rating()>Локальный рейтинг</button><button onclick=logout()>Сменить профиль</button>`}function logout(){clearInterval(timer);user=null;delete db.current;save();login()}function start(i){li=i;qi=0;score=0;gain=0;mult=user.boost?2:1;user.boost=false;save();question()}function question(){clearInterval(timer);selected=-1;locked=false;seconds=30;const q=data[li][1][qi];options=q.slice(1).map((text,i)=>({text,ok:i===0}));for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}$('app').innerHTML=`<progress max=4 value=${qi}></progress><p>⏱ <span id=clock>30</span> сек</p><h2>Как по-английски «${q[0]}»?</h2><div id=choices>${options.map((o,i)=>`<button id=o${i} onclick=choose(${i})>${o.text}</button>`).join('')}</div><p id=feedback></p><button id=check class=green disabled onclick=check()>Проверить</button><button onclick=home()>Выйти из урока</button>`;timer=setInterval(()=>{seconds--;$('clock').textContent=seconds;if(seconds<=0)check(true)},1000)}function choose(i){if(locked)return;selected=i;options.forEach((_,j)=>$('o'+j).classList.toggle('selected',j===i));$('check').disabled=false}function check(timeout=false){if(locked||(!timeout&&selected<0))return;clearInterval(timer);const ok=selected>=0&&options[selected].ok;if(!ok&&user.retry){user.retry=false;save();alert('Бонусная попытка!');question();return}locked=true;sound(ok);if(ok){score++;const xp=10*mult;gain+=xp;user.xp+=xp;user.gems+=2}options.forEach((o,i)=>{$('o'+i).disabled=true;if(o.ok)$('o'+i).style.borderColor='#58cc02'});$('feedback').className=ok?'good':'bad';$('feedback').textContent=ok?`Верно! +${10*mult} XP`:'Ответ: '+options.find(o=>o.ok).text;$('check').textContent=qi===3?'Завершить урок':'Продолжить';$('check').disabled=false;$('check').onclick=()=>{if(qi===3)finish();else{qi++;question()}};save();stats()}function day(d){return [d.getFullYear(),d.getMonth(),d.getDate()].join('-')}function finish(){if(!locked)return;locked=false;const today=day(new Date()),y=new Date();y.setDate(y.getDate()-1);if(user.last!==today){user.streak=user.last===day(y)?user.streak+1:1;user.last=today}user.done[li]=Math.max(user.done[li]||0,score);const award=b=>{if(!user.badges.includes(b))user.badges.push(b)};award('Первый урок');if(score===4)award('Идеальный урок');if(user.xp>=100)award('100 XP');if(user.xp>=250)award('250 XP');if(user.streak>=3)award('Серия 3 дня');save();stats();$('app').innerHTML=`<h2>Урок завершён 🎉</h2><p>Правильно: ${score}/4 · Получено ${gain} XP</p><button class=green onclick=home()>На главную</button>`}function shop(){stats();$('app').innerHTML='<h2>Магазин</h2><p>Бонусы оплачиваются только игровыми монетами.</p><button onclick=buy(0)>Двойной XP на следующий урок — 150 💎</button><button onclick=buy(1)>Одна повторная попытка — 100 💎</button><button onclick=home()>Назад</button>'}function buy(i){const key=i===0?'boost':'retry',price=i===0?150:100;if(user[key])return alert('Бонус уже куплен');if(user.gems<price)return alert('Недостаточно монет');user.gems-=price;user[key]=true;save();shop()}function rating(){$('app').innerHTML='<h2>Рейтинг этого браузера</h2>'+Object.values(db.users).sort((a,b)=>b.xp-a.xp).map((u,i)=>`<p>${i+1}. ${esc(u.name)} — ${u.xp} XP</p>`).join('')+'<button onclick=home()>Назад</button>'}function toggleTheme(){db.dark=!db.dark;document.body.classList.toggle('dark',db.dark);save()}document.body.classList.toggle('dark',!!db.dark);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});if(db.current&&db.users[db.current]){user=db.users[db.current];home()}else login();</script></body></html>
